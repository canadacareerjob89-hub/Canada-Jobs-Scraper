name: Daily LMIA Job Scraper & Exporter

on:
  schedule:
    # Runs everyday at 06:00 UTC (02:00 AM EST / 11:30 AM IST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI with one click

permissions:
  contents: write

jobs:
  scrape-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Scrape & NOC Sync
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL || 'google/gemini-2.0-flash-lite:free' }}
        run: |
          python -u main.py --clean-expired
          python -u main.py --daily
          python -u update_noc_codes.py
          python -u main.py --export lmia_jobs_master.csv

      - name: Commit & Push Updated Database & CSV
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add jobs_tracker.db lmia_jobs_master.csv
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-sync daily LMIA jobs and NOC codes [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi

      - name: Upload Master CSV as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lmia_jobs_master
          path: lmia_jobs_master.csv
          retention-days: 30
